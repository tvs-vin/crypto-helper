[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypto-helper"
version = "0.1.0"
description = "Self-hosted crypto dashboard (and later trading bot)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "argon2-cffi",
    "pyotp",
    "pydantic-settings",
    "alembic",
    "cryptography",
    "segno",
    "Pillow",
]

[project.scripts]
crypto-helper = "app.cli:main"

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff", "playwright"]

[tool.setuptools.packages.find]
include = ["app*", "toolchain*"]

[tool.setuptools.package-data]
app = [
    "migrations/script.py.mako",
    "data/*.txt",
    "data/fonts/*",
    "embeds/static/*",
    "web/*.html",
    "web/css/*.css",
    "web/js/*.js",
    "web/js/panels/*.js",
    "web/js/package.json",
    "web/fonts/*",
    "web/img/*",
    "web/themes/*.ctheme",
    "web/vendor/xterm/*",
    "web/wallpapers/*",
]
toolchain = ["tester/config.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI idiom: Depends() in argument defaults
ignore = ["B008"]
