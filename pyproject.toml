[project]
name = "crypto-helper"
version = "0.1.0"
description = "Self-hosted crypto dashboard (and later trading bot)"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy>=2",
    "argon2-cffi",
    "pyotp",
    "pydantic-settings",
]

[project.optional-dependencies]
dev = ["pytest", "httpx", "ruff"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# FastAPI idiom: Depends() in argument defaults
ignore = ["B008"]
